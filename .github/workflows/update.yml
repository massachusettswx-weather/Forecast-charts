name: update-forecast-charts

# Two schedules:
#  * every 15 min  - light poll. The pipeline publishes as soon as every model
#                     for a cycle has landed (and re-publishes if a late
#                     ensemble member arrives), so the page is never stale.
#  * 03/09/15/21Z  - 9 h after each model initialisation (= 3 h after the next
#                     cycle's analysis). This is the deadline sweep: it
#                     guarantees a rebuild even if the poll was delayed, and it
#                     is the backstop for products that arrive late.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "webapp/**"
      - "Makefile"
      - "requirements.txt"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      level:
        description: "pressure level (hPa)"
        default: "10"
      lat:
        description: "latitude (0 = NH mean)"
        default: "60"

concurrency:
  group: update-charts
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ERA5_CACHE_DIR: ${{ github.workspace }}/data/era5_cache_slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install eccodes cfgrib || true     # GRIB decode for the fetchers

      # The ERA5 climatology the charts read is the small published artifact
      # (data/era5_summary.json, committed to the repo): a per-calendar-day
      # mean and sigma per domain and level. The raw ERA5 profiles stay on
      # the build machine, so nothing large is cached or uploaded.

      - name: Restore the GRIB index cache
        uses: actions/cache@v6
        with:
          path: data/idx
          key: grib-index-${{ github.run_id }}
          restore-keys: grib-index-

      - name: Restore the fetched series (so a poll that finds nothing new is cheap)
        uses: actions/cache@v6
        with:
          path: data/store/series
          key: series-v3-${{ github.run_id }}
          restore-keys: series-v3-

      - name: Cycle logic regression tests
        run: python scripts/test_cycles.py

      - name: Sync runs and render charts
        continue-on-error: true
        run: |
          python scripts/pipeline.py sync --level "${{ inputs.level || 10 }}" --lat "${{ inputs.lat || 60 }}"

      - name: Build static site
        run: python scripts/build_site.py --out site_out

      - name: Health check (labels, climatology level, 06z/18z model rule)
        run: |
          set -o pipefail
          python scripts/check_site.py | tee health.txt

      - name: Health check summary
        if: always()
        run: |
          {
            echo "### Chart health check"
            echo ""
            echo '```'
            cat health.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health check (deployed site)
        continue-on-error: true
        run: python scripts/check_site.py --online

      - name: Sanity check
        run: |
          test -f site_out/index.html
          ls -l site_out/fig | tail -5

      - name: Commit the run store
        run: |
          git config user.name  "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add -A data/store || true
          git diff --staged --quiet || git commit -m "charts: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "push failed (permissions?) - Pages artifact below"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
