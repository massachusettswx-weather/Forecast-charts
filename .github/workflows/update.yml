name: update-forecast-charts

# 4x daily, eight hours after each initialisation = two hours after each suite
# is disseminated:  00Z suite -> 08Z | 06Z -> 14Z | 12Z -> 20Z | 18Z -> 02Z
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "webapp/**"
      - "Makefile"
      - "requirements.txt"
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: "pressure level (hPa)"
        default: "10"
      lat:
        description: "latitude (0 = NH mean)"
        default: "60"

concurrency:
  group: update-charts
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ERA5_CACHE_DIR: ${{ github.workspace }}/data/era5_cache_slim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install eccodes cfgrib || true     # GRIB decode for the fetchers

      - name: Restore the ERA5 climatology cache
        uses: actions/cache@v4
        with:
          path: data/era5_cache_slim
          key: era5-slim-v1-${{ hashFiles('scripts/export_era5_slim.py') }}
          restore-keys: era5-slim-v1-

      - name: Restore the GRIB index cache
        uses: actions/cache@v4
        with:
          path: data/idx
          key: grib-index-${{ github.run_id }}
          restore-keys: grib-index-

      - name: Sync runs and render charts
        continue-on-error: true
        run: |
          python scripts/pipeline.py sync --level "${{ inputs.level || 10 }}" --lat "${{ inputs.lat || 60 }}"

      - name: Build static site
        run: python scripts/build_site.py --out site_out

      - name: Sanity check
        run: |
          test -f site_out/index.html
          ls -l site_out/fig | tail -5

      - name: Commit the run store
        run: |
          git config user.name  "chart-bot"
          git config user.email "chart-bot@users.noreply.github.com"
          git add -A data/store || true
          git diff --staged --quiet || git commit -m "charts: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "push failed (permissions?) - Pages artifact below"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
